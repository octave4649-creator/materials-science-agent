[project]
name = "materials-science-agent"
version = "0.1.0"
description = "方向三：材料科学文献驱动的科学发现智能体"
requires-python = ">=3.10"
dependencies = [
    "sciverse>=0.11.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
extraction = ["mineru[all]"]
validation = ["pymatgen>=2024.0", "mp-api>=0.40"]
search = ["scikit-learn>=1.3", "pymoo>=0.6", "deap>=1.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
