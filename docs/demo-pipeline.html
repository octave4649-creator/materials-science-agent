<title>Agent 流水线 · 六阶段过程演示</title>
<style>
  :root {
    --deep-blue: #1A5F9E; --ice: #F7F9FC; --mint: #4ECDC4; --warm: #FF8C42;
    --ink: #2B3A4A; --muted: #8C9AA8; --line: #E3EAF2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
         background: var(--ice); color: var(--ink); line-height: 1.6; }
  .hero { background: linear-gradient(135deg, #12456F 0%, var(--deep-blue) 55%, #1E7BB5 100%);
          color: #fff; padding: 40px 32px 30px; text-align: center; }
  .hero h1 { font-size: 25px; font-weight: 700; letter-spacing: 1px; }
  .hero p { margin-top: 10px; font-size: 14px; color: #D8E6F5; }
  .hero .backlink { display: inline-block; margin-top: 16px; color: #C7DAF0; font-size: 13px;
                    text-decoration: none; border: 1px solid rgba(255,255,255,0.3);
                    padding: 6px 16px; border-radius: 999px; transition: all .18s; }
  .hero .backlink:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .flowbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
             background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px;
             box-shadow: 0 4px 20px rgba(26,95,158,0.06); position: sticky; top: 0; z-index: 10; }
  .flowbar button { border: none; background: transparent; color: var(--muted); font-size: 13px;
                    padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: all .18s;
                    white-space: nowrap; }
  .flowbar button:hover { background: #EEF4FB; color: var(--deep-blue); }
  .flowbar button.active { background: var(--deep-blue); color: #fff; font-weight: 600; }
  .flowbar button .no { display: inline-block; width: 20px; height: 20px; line-height: 20px;
                         border-radius: 50%; background: rgba(26,95,158,0.12); color: var(--deep-blue);
                         font-size: 11px; margin-right: 6px; text-align: center; }
  .flowbar button.active .no { background: rgba(255,255,255,0.25); color: #fff; }
  .flowbar .arrow { color: var(--muted); font-size: 12px; }
  main { max-width: 1060px; margin: 22px auto 60px; padding: 0 20px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 12px;
              margin-bottom: 18px; flex-wrap: wrap; }
  .controls button { border: 1px solid var(--line); background: #fff; color: var(--deep-blue);
                     font-size: 13px; padding: 8px 18px; border-radius: 10px; cursor: pointer;
                     transition: all .18s; }
  .controls button:hover { background: #EEF4FB; border-color: var(--deep-blue); }
  .controls button.primary { background: var(--deep-blue); color: #fff; border-color: var(--deep-blue); }
  .controls button.primary:hover { background: #12456F; }
  .controls .ind { font-size: 13px; color: var(--muted); min-width: 90px; text-align: center; }
  section.panel { display: none; }
  section.panel.active { display: block; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px;
          padding: 18px 20px; margin-bottom: 16px;
          box-shadow: 0 4px 20px rgba(26,95,158,0.08); }
  .card h2 { font-size: 16px; margin-bottom: 12px; color: var(--deep-blue); }
  .card h3 { font-size: 14px; margin: 12px 0 6px; color: var(--ink); }
  .stage-title { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .stage-title .badge { background: var(--deep-blue); color: #fff; font-size: 12px; font-weight: 600;
                        padding: 3px 12px; border-radius: 999px; white-space: nowrap; }
  .stage-title h2 { margin: 0; }
  .stage-desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px;
         margin-right: 6px; vertical-align: middle; }
  .tag.novelty-new { background: #E4F7F5; color: #0E8F86; }
  .tag.novelty-partial { background: #FFF1E6; color: #D9701B; }
  .tag.novelty-known { background: #EEF0F4; color: var(--muted); }
  .tag.ev { background: #E9F1FB; color: var(--deep-blue); }
  .tag.verdict-known { background: #E4F7F5; color: #0E8F86; }
  .tag.verdict-new { background: #E4F7F5; color: #0E8F86; }
  .tag.verdict-counter { background: #FDEBEA; color: #C73E3E; }
  .tag.verdict-fail { background: #FFF1E6; color: #D9701B; }
  .tag.src { background: #EEF0F4; color: var(--muted); }
  .tag.llm { background: #EFEAF8; color: #6B4FA3; }
  .tag.role { background: #E9F1FB; color: var(--deep-blue); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--deep-blue); font-weight: 600; background: #F4F8FD; white-space: nowrap; }
  .pill { display: inline-block; min-width: 34px; text-align: center; padding: 1px 8px;
          border-radius: 8px; font-size: 12px; font-weight: 600; }
  .pill.good { background: #E4F7F5; color: #0E8F86; }
  .pill.mid { background: #FFF1E6; color: #D9701B; }
  .pill.low { background: #FDEBEA; color: #C73E3E; }
  .pill.blue { background: #E9F1FB; color: var(--deep-blue); }
  .muted { color: var(--muted); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  .kv b { color: var(--deep-blue); white-space: nowrap; }
  .chunk { background: #F4F8FD; border-left: 3px solid var(--deep-blue); border-radius: 8px;
           padding: 10px 14px; font-size: 12px; color: var(--ink); margin: 8px 0; }
  .note { background: #F4F8FD; border-left: 3px solid var(--deep-blue); border-radius: 8px;
          padding: 10px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .note.warn { border-left-color: var(--warm); background: #FFF7F0; }
  .flow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; }
  .flow .step { background: #EEF4FB; color: var(--deep-blue); border-radius: 10px;
                padding: 8px 14px; font-weight: 600; }
  .flow .arrow { color: var(--muted); }
  .gap-item, .find-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
                          margin-bottom: 10px; background: #FCFEFF; }
  .gap-item .stmt { font-size: 13px; }
  .find-item .rel { font-size: 13px; font-weight: 600; color: var(--deep-blue); }
  .find-item .hyp { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .log-line { font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .log-line b { color: var(--deep-blue); font-weight: 600; }
  .log-line .role { color: #6B4FA3; font-weight: 600; }
  .stat-bars { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 4px; }
  .stat-bar { flex: 1; min-width: 150px; background: #fff; border: 1px solid var(--line);
              border-radius: 12px; padding: 12px 16px; text-align: center; }
  .stat-bar b { display: block; font-size: 22px; color: var(--deep-blue); }
  .stat-bar span { font-size: 12px; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 0 40px; }
  footer code { background: #EEF0F4; padding: 1px 6px; border-radius: 6px; }
  @media (max-width: 640px) {
    .hero h1 { font-size: 20px; }
    .flowbar button { font-size: 12px; padding: 6px 10px; }
    main { padding: 0 12px; }
  }
</style>

      "tool": "证据链检查器 + JSON 审计日志 + 降级留痕",
      "overview": { "检索文献 doc_id": 80, "Gap 结论": 29, "搜索 finding": 156, "验证产物": 47, "知识库条目": 5 },
      "coverage": [
        { "type": "Gap", "total": 29, "traceable": 29, "no_evidence": 0 },
        { "type": "Finding", "total": 156, "traceable": 156, "no_evidence": 0 },

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('pipe-data').textContent);
  var stages = DATA.stages;
  var cur = 0;
  var timer = null;
  var autoOn = false;

  var flowbar = document.getElementById('flowbar');
  stages.forEach(function (s, i) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = '<span class="no">' + (i + 1) + '</span>' + s.name;
    btn.addEventListener('click', function () { go(i); });
    flowbar.appendChild(btn);
    if (i < stages.length - 1) {
      var a = document.createElement('span');
      a.className = 'arrow';
      a.textContent = '→';
      flowbar.appendChild(a);
    }
  });

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function noveltyTag(n) {
    if (n === '新知') return '<span class="tag novelty-new">新知</span>';
    if (n === '部分已知') return '<span class="tag novelty-partial">部分已知</span>';
    return '<span class="tag novelty-known">已知</span>';
  }
  function verdictTag(v) {
    if (v === '已知') return '<span class="tag verdict-known">已知</span>';
    if (v === '新知') return '<span class="tag verdict-new">新知</span>';
    if (v === '反例') return '<span class="tag verdict-counter">反例</span>';
    return '<span class="tag verdict-fail">验证失败</span>';
  }
  function srcTag(s) {
    return s === 'llm'
      ? '<span class="tag llm">LLM 推理</span>'
      : '<span class="tag src">' + esc(s) + '</span>';
  }

  function render(i) {
    var s = stages[i];
    var html = '';
    html += '<div class="stage-title"><span class="badge">步骤 ' + (i + 1) + ' / 6</span><h2>' + esc(s.name) + ' · ' + esc(s.sub) + '</h2></div>';
    html += '<div class="stage-desc">' + esc(s.desc) + '</div>';

    if (s.id === 'retrieval') {
      html += '<div class="card"><h2>检索输入</h2><div class="kv">';
      html += '<b>研究问题</b><span>' + esc(s.query) + '</span>';
      html += '<b>子查询</b><span>' + esc(s.sub_queries.join('；')) + '</span>';
      html += '<b>召回数量</b><span><b style="color:var(--deep-blue)">' + s.total_found + '</b> 篇（语义命中 ' + s.semantic_hits + ' 篇，库表补充 ' + (s.papers.length - s.semantic_hits) + ' 篇）</span>';
      html += '<b>调用工具</b><span>' + esc(s.tool) + '</span>';
      html += '</div></div>';
      html += '<div class="card"><h2>候选文献清单（按语义评分排序）</h2><table><thead><tr><th>#</th><th>文献标题</th><th>年份</th><th>期刊</th><th>语义评分</th><th>引用</th><th>来源</th></tr></thead><tbody>';
      s.papers.forEach(function (p, j) {
        html += '<tr><td>' + (j + 1) + '</td><td>' + esc(p.title) + (p.doi ? '<div class="muted">DOI: ' + esc(p.doi) + '</div>' : '') + '</td><td>' + esc(p.year) + '</td><td>' + esc(p.journal) + '</td>';
        html += '<td>' + (p.score ? '<span class="pill blue">' + esc(p.score) + '</span>' : '<span class="muted">—</span>') + '</td>';
        html += '<td>' + esc(p.cite) + '</td><td>' + (p.source === 'semantic' ? '<span class="tag ev">语义命中</span>' : '<span class="tag src">库表补充</span>') + '</td></tr>';
      });
      html += '</tbody></table></div>';
      html += '<div class="card"><h2>证据片段（agentic-search 返回，可回溯）</h2>';
      s.papers.filter(function (p) { return p.chunk; }).forEach(function (p) {
        html += '<div class="chunk"><b style="color:var(--deep-blue)">评分 ' + esc(p.score) + '</b> · 页码 p.' + esc(p.page) + ' · ' + esc(p.journal) + ' ' + esc(p.year) + '<br>' + esc(p.chunk) + '</div>';
      });
      html += '<div class="note">每条证据片段对应唯一 doc_id，构成后续证据链的源头（source=sciverse, fetched_at 时间戳留痕）。</div></div>';
    }

    if (s.id === 'extraction') {
      html += '<div class="card"><h2>抽取 Schema（五类结构化信息）</h2>';
      html += '<div class="flow"><span class="step">材料成分</span><span class="arrow">→</span><span class="step">晶体结构</span><span class="arrow">→</span><span class="step">材料性能</span><span class="arrow">→</span><span class="step">模拟方法</span><span class="arrow">→</span><span class="step">合成条件</span></div>';
      html += '<div class="note">MinerU 将 PDF 解析为结构化 Markdown → LLM 按 Schema 输出 JSON → Schema 校验 + 原文回查防幻觉 → 去重合并入库。</div></div>';
      html += '<div class="card"><h2>知识库抽取结果（' + s.n_records + ' 条）</h2><table><thead><tr><th>材料体系</th><th>性能</th><th>合成条件</th><th>置信度</th><th>来源 doc_id</th></tr></thead><tbody>';
      s.records.forEach(function (r) {
        html += '<tr><td><b style="color:var(--deep-blue)">' + esc(r.formula) + '</b></td><td>' + esc(r.properties) + '</td><td>' + esc(r.synthesis) + '</td>';
        html += '<td><span class="pill mid">' + esc(r.confidence) + '</span></td><td class="muted">' + esc(r.doc_id) + '</td></tr>';
      });
      html += '</tbody></table><div class="note">抽取记录通过 doc_id 关联回原文，形成「材料-性能-证据」三元组知识库，作为 Gap 识别与路线 A 搜索的输入。</div></div>';
    }

    if (s.id === 'gaps') {
      html += '<div class="stat-bars">';
      html += '<div class="stat-bar"><b>' + s.n_gaps + '</b><span>识别 Gap 总数</span></div>';
      Object.keys(s.stats.types).forEach(function (k) {
        html += '<div class="stat-bar"><b>' + s.stats.types[k] + '</b><span>' + esc(k) + '</span></div>';
      });
      html += '</div>';
      html += '<div class="card"><h2>新颖性判定分布</h2>';
      Object.keys(s.stats.novelty).forEach(function (k) {
        html += noveltyTag(k) + ' <b>' + s.stats.novelty[k] + '</b> 条 &nbsp;';
      });
      html += '<span class="muted" style="margin-left:8px">｜ 来源：coverage ' + s.stats.sources.coverage + ' 条 / LLM 推理 ' + s.stats.sources.llm + ' 条</span>';
      html += '</div>';
      html += '<div class="card"><h2>代表性 Gap（含证据链与可操作性）</h2>';
      s.gaps.forEach(function (g, j) {
        html += '<div class="gap-item"><div class="muted">#' + (j + 1) + ' ' + esc(g.type) + ' ' + noveltyTag(g.novelty) + ' ' + srcTag(g.source) + ' 置信度 ' + g.conf + '</div>';
        html += '<div class="stmt">' + esc(g.statement) + '</div>';
        html += '<div class="muted" style="margin-top:6px">可操作性：' + esc(g.operability) + '</div></div>';
      });
      html += '<div class="note">每条 Gap 均带证据链（evidence_ids → 文献 doc_id）、Sciverse 回查验证与人工复核（novelty_confirmed + reviewer_note），保证「准确率 × 新颖性 × 可操作性」。</div></div>';
    }

    if (s.id === 'search') {
      html += '<div class="card"><h2>LLM 与搜索算法深度融合的三种角色</h2><table><thead><tr><th>角色</th><th>作用</th></tr></thead><tbody>';
      s.roles.forEach(function (r) {
        html += '<tr><td><span class="tag role">' + esc(r.name) + '</span></td><td>' + esc(r.desc) + '</td></tr>';
      });
      html += '</tbody></table></div>';
      html += '<div class="card"><h2>发现结果（算法：' + esc(s.algo) + '）</h2>';
      html += '<div class="find-item"><div class="rel">' + esc(s.relation) + '</div>';
      html += '<div class="hyp">假设：' + esc(s.hypothesis) + '</div>';
      html += '<div class="muted" style="margin-top:6px">机制：' + esc(s.mechanism) + '</div></div>';
      html += '<table><thead><tr><th>候选</th><th>掺杂元素</th><th>浓度</th><th>LLM 评估分</th><th>代理拟合 R²</th></tr></thead><tbody>';
      s.candidates.forEach(function (c) {
        html += '<tr><td><b style="color:var(--deep-blue)">' + esc(c.formula) + '</b></td><td>' + esc(c.dopant) + '</td><td>' + esc(c.concentration) + '</td>';
        html += '<td><span class="pill good">' + c.score + '</span></td><td><span class="pill blue">' + esc(c.r2) + '</span></td></tr>';
      });
      html += '</tbody></table>';
      html += '<div class="note">LLM 调用 <b style="color:#6B4FA3">' + s.llm_calls + '</b> 次 · 失败 ' + s.llm_failures + ' 次 · 已融合 LLM 评估（used_llm=' + s.used_llm + '）——LLM 作为科学合理性评估器参与每次采样打分。</div></div>';
      html += '<div class="card"><h2>搜索运行轨迹（search_log，真实留痕）</h2>';
      s.log.forEach(function (l) {
        html += '<div class="log-line"><b>' + esc(l.action) + '</b> ' + (l.role ? '<span class="role">[LLM·' + esc(l.role) + ']</span> ' : '') + esc(l.detail) + '</div>';
      });
      html += '<div class="note">每次探索（生成/迭代）都记录：动作、候选数、LLM 角色、时间戳——构成搜索过程的完整审计轨迹。</div></div>';
    }

    if (s.id === 'validation') {
      html += '<div class="card"><h2>验证判定分布（' + s.n_candidates + ' 个候选）</h2>';
      Object.keys(s.verdict_stats).forEach(function (k) {
        html += verdictTag(k) + ' <b>' + s.verdict_stats[k] + '</b> &nbsp;';
      });
      html += '</div>';
      s.results.forEach(function (r) {
        html += '<div class="card"><h2>候选 ' + esc(r.candidate) + '（母体 ' + esc(r.host) + ' · 掺杂 ' + esc(r.dopant) + ' ' + esc(r.conc) + '） ' + verdictTag(r.verdict) + '</h2>';
        html += '<div class="kv"><b>判定依据</b><span>' + esc(r.reason) + '</span></div>';
        html += '<h3>性质一致性检查（checks）</h3><table><thead><tr><th>性质</th><th>数据库值</th><th>一致性</th><th>说明</th></tr></thead><tbody>';
        r.checks.forEach(function (c) {
          html += '<tr><td>' + esc(c.property) + '</td><td>' + esc(c.db) + '</td>';
          html += '<td>' + (c.ok ? '<span class="pill good">一致</span>' : '<span class="pill low">不一致</span>') + '</td><td class="muted">' + esc(c.note) + '</td></tr>';
        });
        html += '</tbody></table>';
        html += '<h3>数据库条目（entries）</h3><table><thead><tr><th>数据库</th><th>化学式</th><th>entry_id</th><th>ΔE (eV/atom)</th><th>hull (eV/atom)</th><th>带隙 (eV)</th><th>稳定</th></tr></thead><tbody>';
        r.entries.forEach(function (e) {
          html += '<tr><td>' + esc(e.db) + '</td><td>' + esc(e.formula) + '</td><td>' + esc(e.entry_id) + '</td><td>' + esc(e.delta_e) + '</td><td>' + esc(e.stability) + '</td><td>' + esc(e.band_gap) + '</td>';
          html += '<td>' + (e.stable ? '<span class="pill good">是</span>' : '<span class="pill low">否</span>') + '</td></tr>';
        });
        html += '</tbody></table>';
        html += '<div class="muted" style="margin-top:6px">数据来源：<code>' + esc(r.source_url) + '</code></div>';
      });
      html += '<div class="note warn">验证区分「新知」与「已知」：母体库内稳定 = 已知体系支撑；掺杂成分库外扩展 = novel_dopant 标记，为后续实验/DFT 验证提供方向。</div>';
    }

    if (s.id === 'audit') {
      html += '<div class="card"><h2>全流程数据概览</h2><div class="stat-bars">';
      Object.keys(s.overview).forEach(function (k) {
        html += '<div class="stat-bar"><b>' + s.overview[k] + '</b><span>' + esc(k) + '</span></div>';
      });
      html += '</div></div>';
      html += '<div class="card"><h2>证据链覆盖（无来源结论检查）</h2><table><thead><tr><th>结论类型</th><th>总数</th><th>可追溯</th><th>无证据</th><th>覆盖率</th></tr></thead><tbody>';
      s.coverage.forEach(function (c) {
        var rate = Math.round(c.traceable / c.total * 100);
        html += '<tr><td>' + esc(c.type) + '</td><td>' + c.total + '</td><td>' + c.traceable + '</td><td>' + c.no_evidence + '</td>';
        html += '<td><span class="pill ' + (rate >= 90 ? 'good' : 'mid') + '">' + rate + '%</span></td></tr>';
      });
      html += '</tbody></table>';
      html += '<div class="muted">无证据结论（evidence_ids 为空，共 ' + s.no_evidence.length + ' 条）：' + s.no_evidence.join('、') + '</div>';
      html += '</div>';
      html += '<div class="card"><h2>Agent 日志健康度（JSON 审计日志）</h2><table><thead><tr><th>Agent</th><th>日志数</th><th>成功率</th></tr></thead><tbody>';
      s.health.forEach(function (h) {
        html += '<tr><td>' + esc(h.agent) + '</td><td>' + h.logs + '</td><td><span class="pill ' + (parseFloat(h.ok) >= 0.9 ? 'good' : 'mid') + '">' + h.ok + '</span></td></tr>';
      });
      html += '</tbody></table></div>';
      html += '<div class="card"><h2>降级留痕（' + s.degraded + ' 条 error / skipped / degraded）</h2>';
      s.degrade_samples.forEach(function (d) {
        html += '<div class="log-line"><b style="color:#D9701B">' + esc(d.status) + '</b> [' + esc(d.ts) + '] ' + esc(d.agent) + '：' + esc(d.msg) + '</div>';
      });
      html += '<div class="note warn">LLM/Sciverse 缺失时降级（retry → 简化 prompt → 跳过并记录），保证流水线可运行且不产生无来源结论——审计可复现性。</div></div>';
    }

    document.getElementById('stage').innerHTML = html;
    document.getElementById('ind').textContent = (i + 1) + ' / ' + stages.length;
    var btns = flowbar.querySelectorAll('button');
    for (var k = 0; k < btns.length; k++) {
      btns[k].classList.toggle('active', k === i * 2);
    }
  }

  function go(i) {
    cur = (i + stages.length) % stages.length;
    render(cur);
    if (autoOn) restart();
  }
  function next() { go(cur + 1); }
  function prev() { go(cur - 1); }
  function restart() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () { go(cur + 1); }, 6000);
  }
  function toggleAuto() {
    autoOn = !autoOn;
    var btn = document.getElementById('btn-auto');
    if (autoOn) { restart(); btn.textContent = '⏸ 暂停'; }
    else { if (timer) clearInterval(timer); timer = null; btn.textContent = '▶ 自动播放'; }
  }

  document.getElementById('btn-next').addEventListener('click', next);
  document.getElementById('btn-prev').addEventListener('click', prev);
  document.getElementById('btn-auto').addEventListener('click', toggleAuto);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  render(0);
})();
</script>
</body>
</html>
